name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --no-fund
      - name: Audit dependencies
        working-directory: backend
        run: npm audit --audit-level=high
      - name: Check JavaScript syntax
        run: |
          for file in *.js backend/src/*.js tools/*.js; do
            node --check "$file"
          done
      - name: Run tests
        working-directory: backend
        run: npm test
